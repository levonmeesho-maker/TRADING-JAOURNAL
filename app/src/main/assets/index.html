<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trading Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --gold:#0d9488;
    --gold-dark:#0f766e;
    --cream:#f8fafc;
    --ink:#1e293b;
    --border:#e2e8f0;
    --header-bg:#e6f4f1;
    --green:#16a34a;
    --red:#dc2626;
    --muted:#64748b;
    --accent-soft:#f0faf9;
    --accent-soft-hover:#d9f2ef;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
    padding-bottom:96px;
  }
  header{
    display:flex;
    flex-direction:column;
    border-bottom:2px solid var(--gold);
    padding:20px 32px;
    background:#fff;
    gap:14px;
    position:sticky;
    top:0;
    z-index:400;
  }
  h1{
    color:var(--gold-dark);
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.5px;
    font-weight:700;
    text-align:center;
  }
  .header-second-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .date{ color:var(--muted); font-size:0.9rem; white-space:nowrap; }
  .header-balance-box{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    background:var(--accent-soft);
    border:1px solid var(--gold);
    border-radius:8px;
    padding:6px 14px;
    min-width:90px;
  }
  .header-balance-label{
    font-family: Arial, sans-serif;
    font-size:0.65rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--gold-dark);
    font-weight:700;
  }
  .header-balance-value{
    font-family: Georgia, serif;
    font-size:1rem;
    font-weight:700;
    color:var(--ink);
  }

  nav.tabbar{
    display:flex;
    background:var(--header-bg);
    border-top:2px solid var(--gold);
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:500;
    box-shadow:0 -2px 10px rgba(15,23,42,0.08);
  }
  nav.tabbar button{
    flex:1;
    padding:14px 8px;
    background:none;
    border:none;
    font-size:1.5rem;
    line-height:1;
    color:var(--gold-dark);
    cursor:pointer;
    border-top:3px solid transparent;
    transition:background 0.15s ease, color 0.15s ease;
  }
  nav.tabbar button.active{
    color:var(--ink);
    border-top:3px solid var(--gold);
    background:#fff;
  }
  nav.tabbar button:hover{ background:var(--accent-soft-hover); }

  .page{ display:none; padding:28px 32px; }
  .page.active{ display:block; }

  form.entry{
    display:flex;
    flex-direction:column;
    gap:18px;
    max-width:560px;
  }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:150px; }
  .field label{
    font-family: Arial, Helvetica, sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:700;
  }
  form.entry input,
  form.entry select,
  form.entry textarea,
  .field input,
  .field select,
  .field textarea{
    font-family: Arial, Helvetica, sans-serif;
    font-size:0.95rem;
    padding:11px 14px;
    border:1.5px solid var(--border);
    border-radius:8px;
    color:var(--ink);
    background:#fff;
    width:100%;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  form.entry input:hover,
  form.entry select:hover,
  form.entry textarea:hover,
  .field input:hover,
  .field select:hover,
  .field textarea:hover{
    border-color:#cbd5e1;
  }
  form.entry input:focus,
  form.entry select:focus,
  form.entry textarea:focus,
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(13,148,136,0.15);
  }
  form.entry textarea,
  .field textarea{
    min-height:100px;
    resize:vertical;
    font-family: Arial, sans-serif;
    line-height:1.5;
  }

  .img-upload-row{ display:flex; gap:16px; flex-wrap:wrap; }
  .img-upload-box{
    flex:1;
    min-width:160px;
    border:1.5px dashed var(--gold);
    border-radius:10px;
    padding:16px;
    text-align:center;
    background:var(--accent-soft);
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .img-upload-box:hover{ background:var(--accent-soft-hover); }
  .img-upload-box p{
    margin:0 0 10px;
    font-family: Arial, sans-serif;
    font-size:0.8rem;
    color:var(--gold-dark);
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .img-upload-box img{
    max-width:100%;
    max-height:140px;
    border-radius:6px;
    display:block;
    margin:0 auto 10px;
  }
  .img-upload-box button{
    background:#fff;
    border:1.5px solid var(--gold);
    color:var(--gold-dark);
    font-family: Arial, sans-serif;
    font-size:0.8rem;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .img-upload-box button:hover{ background:var(--accent-soft-hover); }

  button.add{
    background:var(--gold);
    color:#fff;
    border:none;
    padding:13px 26px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight:bold;
    letter-spacing:0.5px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.95rem;
    align-self:flex-start;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  button.add:hover{ background:var(--gold-dark); }
  button.add:active{ transform:scale(0.98); }

  .export-btn{
    background:#065f46;
    color:#fff;
    border:none;
    padding:12px 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight:bold;
    letter-spacing:0.5px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.9rem;
    margin-bottom:22px;
    transition:background 0.15s ease;
  }
  .export-btn:hover{ background:#064e3b; }
  .export-btn:disabled{ background:#94a3b8; cursor:wait; }

  .save-status{
    font-family: Arial, Helvetica, sans-serif;
    font-size:0.8rem;
    color:var(--muted);
    margin-left:14px;
  }

  .trade-list{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:24px;
  }
  .trade-chip{
    background:#fff;
    border:1.5px solid var(--gold);
    color:var(--gold-dark);
    font-family: Arial, sans-serif;
    font-weight:bold;
    font-size:0.9rem;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .trade-chip:hover{ background:var(--accent-soft-hover); }
  .trade-chip.selected{ background:var(--gold); color:#fff; }

  .folder-chip{
    background:var(--accent-soft);
    border:1.5px solid var(--gold);
    color:var(--gold-dark);
    font-family: Arial, sans-serif;
    font-weight:bold;
    font-size:0.95rem;
    padding:16px 22px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    min-width:160px;
    transition:background 0.15s ease;
  }
  .folder-chip:hover{ background:var(--accent-soft-hover); }
  .folder-count{
    font-weight:normal;
    font-size:0.78rem;
    color:var(--muted);
  }
  .folder-heading{
    font-family: Georgia, serif;
    color:var(--gold-dark);
    margin:0;
    font-size:1.1rem;
    font-weight:700;
  }
  .folder-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .folder-back-btn{
    background:#fff;
    border:1.5px solid var(--gold);
    color:var(--gold-dark);
    font-family: Arial, sans-serif;
    font-weight:bold;
    font-size:0.85rem;
    cursor:pointer;
    padding:8px 18px;
    border-radius:8px;
    transition:background 0.15s ease;
  }
  .folder-back-btn:hover{ background:var(--accent-soft-hover); }

  .empty-msg{
    font-family: Arial, sans-serif;
    color:var(--muted);
    font-style:italic;
  }

  .trade-detail{
    border:1px solid var(--border);
    border-radius:10px;
    padding:22px;
    max-width:640px;
    background:#fff;
    box-shadow:0 1px 3px rgba(15,23,42,0.06);
  }
  .trade-detail h3{
    margin:0 0 16px;
    font-family: Georgia, serif;
    color:var(--gold-dark);
    font-weight:700;
  }
  .detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 24px;
    font-family: Arial, Helvetica, sans-serif;
    font-size:0.95rem;
    margin-bottom:18px;
  }
  .k{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--muted);
    margin-bottom:2px;
    font-weight:700;
  }
  .buy{ color:var(--green); font-weight:700; }
  .sell{ color:var(--red); font-weight:700; }
  .result-pos{ color:var(--green); font-weight:700; }
  .result-neg{ color:var(--red); font-weight:700; }

  .detail-logic{
    font-family: Arial, sans-serif;
    font-size:0.92rem;
    background:var(--accent-soft);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    margin-bottom:18px;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .detail-images{ display:flex; gap:18px; flex-wrap:wrap; }
  .detail-images div{ text-align:center; }
  .detail-images p{
    font-family: Arial, sans-serif;
    font-size:0.75rem;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
    font-weight:700;
  }
  .detail-images img{
    width:150px;
    height:110px;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--border);
    cursor:pointer;
  }
  .no-image{
    width:150px;
    height:110px;
    border:1.5px dashed var(--border);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-family: Arial, sans-serif;
    font-size:0.8rem;
  }

  h3.summary-title{ font-size:1.4rem; margin:0 0 16px; color:var(--ink); font-weight:700; }
  table.summary{ width:100%; max-width:520px; border-collapse:collapse; font-family: Arial, Helvetica, sans-serif; background:#fff; border-radius:8px; overflow:hidden; }
  table.summary td{ padding:14px 16px; border:1px solid var(--border); font-family: Georgia, serif; }
  table.summary td.label{ text-align:center; width:50%; color:var(--muted); font-weight:700; }
  table.summary td.value{ text-align:center; font-weight:bold; color:var(--ink); }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,0.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:10px;
    padding:20px;
    width:90%;
    max-width:520px;
    text-align:center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .modal-box img{ max-width:100%; max-height:60vh; border-radius:6px; }
  .modal-box button{
    margin-top:16px;
    background:var(--gold);
    color:#fff;
    border:none;
    padding:9px 20px;
    border-radius:8px;
    cursor:pointer;
    font-family: Arial, sans-serif;
    transition:background 0.15s ease;
  }
  .modal-box button:hover{ background:var(--gold-dark); }

  /* Wallet */
  .wallet-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    max-width:480px;
    margin-bottom:24px;
    box-shadow:0 1px 3px rgba(15,23,42,0.06);
  }
  .wallet-card-top{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  .wallet-icon{ font-size:2.4rem; line-height:1; }
  .wallet-label{
    margin:0;
    font-family: Arial, sans-serif;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    font-weight:700;
  }
  .wallet-balance{
    margin:4px 0 0;
    font-family: Georgia, serif;
    font-size:1.8rem;
    font-weight:700;
    color:var(--ink);
  }
  .wallet-btn-row{ display:flex; gap:12px; }
  .wallet-action-btn{
    flex:1;
    border:none;
    padding:11px 14px;
    border-radius:8px;
    font-family: Arial, sans-serif;
    font-weight:bold;
    font-size:0.88rem;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .wallet-action-btn.deposit{ background:var(--green); color:#fff; }
  .wallet-action-btn.deposit:hover{ background:#15803d; }
  .wallet-action-btn.withdraw{ background:var(--red); color:#fff; }
  .wallet-action-btn.withdraw:hover{ background:#b91c1c; }

  .wallet-history-heading{
    font-family: Georgia, serif;
    color:var(--ink);
    font-weight:700;
    font-size:1.1rem;
    margin:0 0 14px;
  }
  .wallet-history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
    max-width:480px;
    font-family: Arial, sans-serif;
  }
  .wallet-history-note{ font-weight:700; font-size:0.9rem; color:var(--ink); }
  .wallet-history-date{ font-size:0.78rem; color:var(--muted); margin-top:2px; }

  /* Performance charts */
  .chart-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    max-width:600px;
    box-shadow:0 1px 3px rgba(15,23,42,0.06);
  }
  .chart-empty{
    font-family: Arial, sans-serif;
    color:var(--muted);
    font-style:italic;
    font-size:0.9rem;
  }
  .bar-chart-row{
    display:flex;
    align-items:flex-end;
    gap:32px;
    height:160px;
    padding:0 12px;
  }
  .bar-chart-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    flex:1;
  }
  .bar-chart-count{
    font-family: Arial, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    margin-bottom:6px;
    color:var(--ink);
  }
  .bar-chart-bar{
    width:56px;
    border-radius:6px 6px 0 0;
    transition:height 0.3s ease;
  }
  .bar-chart-bar.win{ background:var(--green); }
  .bar-chart-bar.loss{ background:var(--red); }
  .bar-chart-label{
    font-family: Arial, sans-serif;
    font-size:0.78rem;
    color:var(--muted);
    margin-top:8px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    font-weight:700;
  }

  @media (max-width:700px){
    header{ flex-direction:column; gap:8px; padding:20px; }
    .page{ padding:20px; }
    .detail-grid{ grid-template-columns:1fr; }
    nav.tabbar button{ font-size:1.3rem; padding:12px 4px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="headerTitle">Trading Journal</h1>
  <div class="header-second-row" id="headerSecondRow">
    <div class="date" id="todayDate"></div>
    <div class="header-balance-box" id="headerBalanceBox">
      <span class="header-balance-label">Balance</span>
      <span class="header-balance-value" id="headerBalanceValue">$0.00</span>
    </div>
  </div>
</header>

<nav class="tabbar">
  <button class="tab-btn active" data-page="trade" title="Trade">➕</button>
  <button class="tab-btn" data-page="running" title="Running Trade">⏳</button>
  <button class="tab-btn" data-page="tradedata" title="Trade Data">📊</button>
  <button class="tab-btn" data-page="performance" title="Performance">📈</button>
  <button class="tab-btn" data-page="profile" title="Profile">👤</button>
</nav>

<section class="page active" id="page-trade">
  <form class="entry" id="entryForm">
    <div class="field-row">
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="pair">Pair</label>
        <input type="text" id="pair" placeholder="e.g. XAUUSD" required style="text-transform:uppercase;">
      </div>
      <div class="field">
        <label for="direction">Direction</label>
        <select id="direction">
          <option value="BUY">BUY</option>
          <option value="SELL">SELL</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="plannedRR">Planned RR</label>
        <input type="number" step="0.1" id="plannedRR" placeholder="e.g. 6" required>
      </div>
    </div>

    <div class="field">
      <label for="logicInput">Trade Logic</label>
      <textarea id="logicInput" placeholder="Why did you take this trade? Setup, confluence, mistakes, lessons..."></textarea>
    </div>

    <div class="img-upload-row">
      <div class="img-upload-box" id="beforeBox">
        <p>Before</p>
        <button type="button" id="beforeUploadBtn">+ Add Image</button>
      </div>
    </div>

    <button class="add" id="addBtn" type="button">ADD TRADE</button>
  </form>
</section>

<section class="page" id="page-running">
  <div class="trade-list" id="runningList"></div>
  <div id="runningDetailWrap"></div>
</section>

<section class="page" id="page-tradedata">
  <button class="export-btn" id="exportBtn" type="button">EXPORT TO EXCEL</button>
  <span class="save-status" id="saveStatus"></span>

  <div class="trade-list" id="tradeList"></div>
  <div id="tradeDetailWrap"></div>
</section>

<section class="page" id="page-performance">
  <h3 class="summary-title">Performance Summary</h3>
  <table class="summary">
    <tr><td class="label">Total Trades</td><td class="value" id="totalTrades">0</td></tr>
    <tr><td class="label">Winning Trades</td><td class="value" id="winTrades">0</td></tr>
    <tr><td class="label">Losing Trades</td><td class="value" id="loseTrades">0</td></tr>
    <tr><td class="label">Total RR</td><td class="value" id="totalRR">0.00R</td></tr>
    <tr><td class="label">Win Rate</td><td class="value" id="winRate">0.0%</td></tr>
    <tr><td class="label">Average RR</td><td class="value" id="avgRR">0.00R</td></tr>
  </table>

  <h4 class="wallet-history-heading" style="margin-top:32px;">Equity Curve</h4>
  <div id="equityCurveWrap" class="chart-card"></div>

  <h4 class="wallet-history-heading" style="margin-top:28px;">Wallet Balance</h4>
  <div id="walletBalanceChartWrap" class="chart-card"></div>

  <h4 class="wallet-history-heading" style="margin-top:28px;">Win / Loss</h4>
  <div id="winLossChartWrap" class="chart-card"></div>
</section>

<section class="page" id="page-profile">
  <h3 class="summary-title">Profile</h3>

  <div class="wallet-card" id="walletCard">
    <div class="wallet-card-top">
      <span class="wallet-icon">👛</span>
      <div>
        <p class="wallet-label">Wallet Balance</p>
        <p class="wallet-balance" id="walletBalanceDisplay">$0.00</p>
      </div>
    </div>
    <div class="wallet-btn-row">
      <button type="button" class="wallet-action-btn deposit" id="openDepositBtn">+ Deposit</button>
      <button type="button" class="wallet-action-btn withdraw" id="openWithdrawBtn">− Withdraw</button>
    </div>
  </div>

  <div id="walletFormWrap"></div>

  <h4 class="wallet-history-heading">Transaction History</h4>
  <div id="walletHistoryList"></div>
</section>

<div class="modal-overlay" id="imgModal">
  <div class="modal-box">
    <h4 id="imgModalTitle" style="margin-top:0;font-family:Georgia,serif;color:var(--gold-dark);font-weight:700;">Image</h4>
    <img id="imgModalPic" src="" alt="Trade screenshot">
    <div><button id="imgModalClose" type="button">Close</button></div>
  </div>
</div>

<input type="file" id="hiddenImgInput" accept="image/*" style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none;">

<script>
const DEFAULT_TRADES = [];

let storageOK = true;
function loadTrades(){
  try{
    const raw = localStorage.getItem('tradingJournalData');
    if(raw) return JSON.parse(raw);
  }catch(err){ storageOK = false; }
  return DEFAULT_TRADES.slice();
}

let trades = loadTrades();
let selectedTradeIndex = null;

let tempBeforeImage = "";
let pendingImageTarget = null; // 'before' (entry form) or a trade index (close form)

// temp After-image uploads per running trade, keyed by trade index, until Close Trade is clicked
let tempCloseAfterImages = {};

function setStatus(msg){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = msg;
}

function saveTrades(){
  try{
    localStorage.setItem('tradingJournalData', JSON.stringify(trades));
    setStatus('Saved ' + new Date().toLocaleTimeString());
  }catch(err){
    storageOK = false;
    setStatus('Auto-save unavailable — use Export to Excel to keep your data');
  }
}

// ---- Wallet ----
function loadWallet(){
  try{
    const raw = localStorage.getItem('tradingJournalWallet');
    if(raw) return JSON.parse(raw);
  }catch(err){}
  return { balance: 0, history: [] };
}
let wallet = loadWallet();

function saveWallet(){
  try{
    localStorage.setItem('tradingJournalWallet', JSON.stringify(wallet));
  }catch(err){}
}

function formatMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2);
}

// amount: positive number, note: what kind of transaction
function addWalletTransaction(amount, type, note){
  wallet.balance += amount;
  wallet.history.push({
    amount: amount,
    type: type, // 'deposit' | 'withdrawal' | 'trade'
    note: note,
    date: todayISO(),
    timestamp: Date.now()
  });
  saveWallet();
}

function renderWallet(){
  document.getElementById('walletBalanceDisplay').textContent = formatMoney(wallet.balance);
  document.getElementById('walletFormWrap').innerHTML = '';
  renderWalletHistory();
}

function renderWalletHistory(){
  const listEl = document.getElementById('walletHistoryList');
  listEl.innerHTML = '';
  if(wallet.history.length === 0){
    listEl.innerHTML = '<p class="empty-msg">No transactions yet.</p>';
    return;
  }
  const sorted = wallet.history.slice().sort((a,b)=> b.timestamp - a.timestamp);
  sorted.forEach(tx=>{
    const row = document.createElement('div');
    row.className = 'wallet-history-row';
    const amtClass = tx.amount >= 0 ? 'result-pos' : 'result-neg';
    const amtSign = tx.amount >= 0 ? '+' : '';
    row.innerHTML = `
      <div>
        <div class="wallet-history-note">${tx.note}</div>
        <div class="wallet-history-date">${tx.date}</div>
      </div>
      <div class="${amtClass}">${amtSign}${formatMoney(tx.amount).replace('-','')}</div>
    `;
    listEl.appendChild(row);
  });
}

function openWalletForm(kind){
  // kind: 'deposit' | 'withdraw'
  const wrap = document.getElementById('walletFormWrap');
  const isDeposit = kind === 'deposit';
  wrap.innerHTML = `
    <div class="trade-detail" style="max-width:420px; margin-bottom:24px;">
      <h3>${isDeposit ? 'Deposit Funds' : 'Withdraw Funds'}</h3>
      <div class="field" style="margin-bottom:16px;">
        <label for="walletAmountInput">Amount</label>
        <input type="number" step="0.01" id="walletAmountInput" placeholder="e.g. 100">
      </div>
      <button class="add" id="walletConfirmBtn" type="button">${isDeposit ? 'CONFIRM DEPOSIT' : 'CONFIRM WITHDRAWAL'}</button>
    </div>
  `;
  wrap.querySelector('#walletConfirmBtn').addEventListener('click', ()=>{
    const val = parseFloat(document.getElementById('walletAmountInput').value);
    if(!val || val <= 0){
      alert('Please enter a valid amount.');
      return;
    }
    if(isDeposit){

    renderWallet();
  });
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function applyDateLimit(){
  document.getElementById('date').max = todayISO();
}

function scheduleMidnightRefresh(){
  const now = new Date();
  const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
  setTimeout(()=>{ applyDateLimit(); scheduleMidnightRefresh(); }, nextMidnight - now);
}

const hiddenImgInput = document.getElementById('hiddenImgInput');

// target: 'before' -> the entry form box; a number -> that running trade's After box.
// root defaults to document, but pass the not-yet-attached card element when building
// a fresh card, since the box doesn't exist in the live document yet at that point.
function renderUploadBox(target, root){
  root = root || document;
  const selector = target === 'before' ? '#beforeBox' : `#closeAfterBox-${target}`;
  const box = root.querySelector(selector);
  if(!box) return;
  const label = target === 'before' ? 'Before' : 'After';
  const value = target === 'before' ? tempBeforeImage : (tempCloseAfterImages[target] || "");
  if(value){
    box.innerHTML = `<p>${label}</p><img src="${value}" alt="${label}"><button type="button" class="change-img-btn" data-upload-target="${target}">Change</button>`;
  } else {
    box.innerHTML = `<p>${label}</p><button type="button" class="change-img-btn" data-upload-target="${target}">+ Add Image</button>`;
  }
}
renderUploadBox('before');

// Single delegated listener on the whole document — this way an upload
// button works the instant it exists in the DOM, no matter when or where
// it was created, with no risk of a missed addEventListener call.
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.change-img-btn');
  if(!btn) return;
  const raw = btn.dataset.uploadTarget;
  pendingImageTarget = (raw === 'before') ? 'before' : Number(raw);
  hiddenImgInput.click();
});

hiddenImgInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file || pendingImageTarget === null) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    if(pendingImageTarget === 'before'){
      tempBeforeImage = evt.target.result;
      renderUploadBox('before');
    } else {
      // by now the running-trade card is already in the live document
      tempCloseAfterImages[pendingImageTarget] = evt.target.result;
      renderUploadBox(pendingImageTarget, document);
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

    .map((t,i)=>i)

    listEl.innerHTML = '<p class="empty-msg">No running trades. Add one from the Trade tab.</p>';

function buildCloseTradeForm(t, i){
  const wrap = document.createElement('div');
  wrap.className = 'trade-detail';
  const dirClass = t.direction === 'BUY' ? 'buy' : 'sell';

  wrap.innerHTML = `
    <h3>${t.date} · ${t.pair}</h3>
    <div class="detail-grid">
      <div><div class="k">Direction</div><span class="${dirClass}">${t.direction}</span></div>
      <div><div class="k">Planned RR</div>${t.plannedRR}</div>
    </div>
    <div class="k" style="margin-bottom:6px;">Trade Logic</div>
    <div class="detail-logic">${t.logic ? t.logic : 'No trade logic written for this trade.'}</div>
    <div class="k" style="margin-bottom:8px;">Before</div>
    ${t.beforeImage ? `<img src="${t.beforeImage}" class="close-before-img" alt="Before" style="width:150px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;margin-bottom:18px;display:block;">` : `<div class="no-image" style="margin-bottom:18px;">No image</div>`}

    <div class="field-row" style="margin-top:20px;">
      <div class="field">
        <label for="closeMarketMove-${i}">Amount</label>
        <input type="number" step="0.01" id="closeMarketMove-${i}" placeholder="e.g. -50">
      </div>
      <div class="field">
        <label for="closeResult-${i}">Result (R)</label>
        <input type="number" step="0.1" id="closeResult-${i}" placeholder="e.g. -1">
      </div>
    </div>

    <div class="field" style="margin-top:20px; margin-bottom:16px;">
      <label for="closeWhatMarketGave-${i}">What Market Gave</label>
      <textarea id="closeWhatMarketGave-${i}" placeholder="What did the market actually give you — did price reach target, reverse early, run further than expected?"></textarea>
    </div>

    <div class="img-upload-row" style="margin:16px 0;">
      <div class="img-upload-box" id="closeAfterBox-${i}">
        <p>After</p>
        <button type="button">+ Add Image</button>
      </div>
    </div>

    <button class="add" id="closeTradeBtn-${i}" type="button">CLOSE TRADE</button>
  `;

  const beforeImgEl = wrap.querySelector('.close-before-img');
  if(beforeImgEl) beforeImgEl.addEventListener('click', ()=>openImagePreview('Before — ' + t.pair, t.beforeImage));

  // wrap isn't attached to the document yet at this point, so scope the
  // lookup to wrap itself rather than document.
  renderUploadBox(i, wrap);

  wrap.querySelector(`#closeTradeBtn-${i}`).addEventListener('click', ()=>{
    const moveVal = wrap.querySelector(`#closeMarketMove-${i}`).value;
    const resultVal = wrap.querySelector(`#closeResult-${i}`).value;
    const whatMarketGaveVal = wrap.querySelector(`#closeWhatMarketGave-${i}`).value.trim();
    if(moveVal === '' || resultVal === ''){
      alert('Please fill in Amount and Result to close this trade.');
      return;
    }
    trades[i].marketMove = Number(moveVal);
    trades[i].result = Number(resultVal);
    trades[i].afterImage = tempCloseAfterImages[i] || "";
    trades[i].whatMarketGave = whatMarketGaveVal;
    trades[i].status = 'closed';
    delete tempCloseAfterImages[i];
    saveTrades();
    updateSummary();

    // Amount flows straight into the wallet: positive adds, negative subtracts
    addWalletTransaction(trades[i].marketMove, 'trade', `${trades[i].pair} · ${trades[i].date}`);

    alert('Trade closed.');
    renderRunningList();
  });

  return wrap;
}

function renderTradeList(){
  const listEl = document.getElementById('tradeList');
  const detailWrap = document.getElementById('tradeDetailWrap');
  listEl.innerHTML = '';
  detailWrap.innerHTML = '';

  // trades saved before the running/closed workflow have no status field —
  // treat those as closed so existing history keeps showing up here
  const closedIndexes = trades
    .map((t,i)=>i)
    .filter(i => trades[i].status === 'closed' || trades[i].status === undefined);

  if(closedIndexes.length === 0){
    listEl.innerHTML = '<p class="empty-msg">No closed trades yet. Close a running trade to see it here.</p>';
    return;
  }

  const chipsWrap = document.createElement('div');
  chipsWrap.className = 'trade-list';

  // most recent trade first; ties (same date) fall back to entry order, newest last-added first
  const order = closedIndexes.sort((a,b)=>{
    if(trades[b].date !== trades[a].date) return trades[b].date.localeCompare(trades[a].date);
    return b - a;
  });

  order.forEach(i=>{
    const t = trades[i];
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'trade-chip' + (selectedTradeIndex === i ? ' selected' : '');
    chip.textContent = t.date;
    chip.addEventListener('click', ()=>{
      selectedTradeIndex = (selectedTradeIndex === i) ? null : i;
      renderTradeList();
    });
    chipsWrap.appendChild(chip);
  });
  listEl.appendChild(chipsWrap);

  if(selectedTradeIndex !== null && trades[selectedTradeIndex]){
    detailWrap.appendChild(buildTradeDetail(trades[selectedTradeIndex], selectedTradeIndex));
  }
}

function updateSummary(){
  const closed = trades.filter(t => t.status === 'closed' || t.status === undefined);
  const total = closed.length;
  const wins = closed.filter(t=>t.result > 0).length;
  const losses = closed.filter(t=>t.result < 0).length;
  const totalRR = closed.reduce((s,t)=>s+Number(t.result),0);
  const winRate = total>0 ? (wins/total*100) : 0;
  const avgRR = total>0 ? (totalRR/total) : 0;

  document.getElementById('totalTrades').textContent = total;
  document.getElementById('winTrades').textContent = wins;
  document.getElementById('loseTrades').textContent = losses;
  document.getElementById('totalRR').textContent = totalRR.toFixed(2) + 'R';
  document.getElementById('winRate').textContent = winRate.toFixed(1) + '%';
  document.getElementById('avgRR').textContent = avgRR.toFixed(2) + 'R';
}

function renderPerformanceCharts(){
  const closed = trades
    .filter(t => t.status === 'closed' || t.status === undefined)
    .slice()
    .sort((a,b)=> a.date.localeCompare(b.date));

  // ---- Equity curve (cumulative R over time) ----
  const equityWrap = document.getElementById('equityCurveWrap');
  if(closed.length === 0){
    equityWrap.innerHTML = '<p class="chart-empty">No closed trades yet — your equity curve will appear here.</p>';
  } else {
    let running = 0;
    const points = closed.map(t=>{ running += Number(t.result); return running; });
    const width = 560, height = 160, pad = 20;
    const minVal = Math.min(0, ...points);
    const maxVal = Math.max(0, ...points);
    const range = (maxVal - minVal) || 1;

    const coords = points.map((v, idx)=>{
      const x = points.length === 1 ? width/2 : pad + (idx / (points.length-1)) * (width - pad*2);
      const y = height - pad - ((v - minVal) / range) * (height - pad*2);
      return [x, y];
    });
    const pathD = coords.map((c,idx)=> (idx===0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const zeroY = height - pad - ((0 - minVal) / range) * (height - pad*2);
    const lastVal = points[points.length-1];
    const lineColor = lastVal >= 0 ? '#16a34a' : '#dc2626';

    equityWrap.innerHTML = `
      <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" xmlns="http://www.w3.org/2000/svg">
        <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${width-pad}" y2="${zeroY.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
        <path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${lineColor}"/>`).join('')}
      </svg>
      <p style="font-family:Arial,sans-serif; font-size:0.85rem; color:var(--muted); margin:8px 0 0;">
        Cumulative R after ${points.length} closed trade${points.length===1?'':'s'}: <strong style="color:${lineColor};">${lastVal.toFixed(2)}R</strong>
      </p>
    `;
  }

  // ---- Wallet Balance over time (deposits, withdrawals, and trade amounts) ----
  const balanceWrap = document.getElementById('walletBalanceChartWrap');
  const sortedHistory = wallet.history.slice().sort((a,b)=> a.timestamp - b.timestamp);
  if(sortedHistory.length === 0){
    balanceWrap.innerHTML = '<p class="chart-empty">No wallet activity yet — deposits, withdrawals, and trade amounts will plot here.</p>';
  } else {
    let runningBal = 0;
    const balPoints = sortedHistory.map(tx=>{ runningBal += tx.amount; return runningBal; });
    const width = 560, height = 160, pad = 20;
    const minVal = Math.min(0, ...balPoints);
    const maxVal = Math.max(0, ...balPoints);
    const range = (maxVal - minVal) || 1;

    const balCoords = balPoints.map((v, idx)=>{
      const x = balPoints.length === 1 ? width/2 : pad + (idx / (balPoints.length-1)) * (width - pad*2);
      const y = height - pad - ((v - minVal) / range) * (height - pad*2);
      return [x, y];
    });
    const balPathD = balCoords.map((c,idx)=> (idx===0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const balZeroY = height - pad - ((0 - minVal) / range) * (height - pad*2);
    const finalBal = balPoints[balPoints.length-1];
    const balColor = finalBal >= 0 ? '#16a34a' : '#dc2626';

    balanceWrap.innerHTML = `
      <svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" xmlns="http://www.w3.org/2000/svg">
        <line x1="${pad}" y1="${balZeroY.toFixed(1)}" x2="${width-pad}" y2="${balZeroY.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
        <path d="${balPathD}" fill="none" stroke="${balColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${balCoords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${balColor}"/>`).join('')}
      </svg>
      <p style="font-family:Arial,sans-serif; font-size:0.85rem; color:var(--muted); margin:8px 0 0;">
        Balance after ${balPoints.length} transaction${balPoints.length===1?'':'s'}: <strong style="color:${balColor};">${formatMoney(finalBal)}</strong>
      </p>
    `;
  }

  // ---- Win / Loss bar chart ----
  const barWrap = document.getElementById('winLossChartWrap');
  const wins = closed.filter(t=>t.result > 0).length;
  const losses = closed.filter(t=>t.result < 0).length;
  if(closed.length === 0){
    barWrap.innerHTML = '<p class="chart-empty">No closed trades yet — win/loss breakdown will appear here.</p>';
  } else {
    const maxCount = Math.max(wins, losses, 1);
    const winHeight = Math.max(6, (wins / maxCount) * 130);
    const lossHeight = Math.max(6, (losses / maxCount) * 130);
    barWrap.innerHTML = `
      <div class="bar-chart-row">
        <div class="bar-chart-col">
          <div class="bar-chart-count">${wins}</div>
          <div class="bar-chart-bar win" style="height:${winHeight}px;"></div>
          <div class="bar-chart-label">Wins</div>
        </div>
        <div class="bar-chart-col">
          <div class="bar-chart-count">${losses}</div>
          <div class="bar-chart-bar loss" style="height:${lossHeight}px;"></div>
          <div class="bar-chart-label">Losses</div>
        </div>
      </div>
    `;
  }
}

    headerRow.eachCell(cell=>{
      cell.font = { bold: true };
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE6F4F1'} };
      cell.alignment = { horizontal:'center', vertical:'middle' };
    });

    const closedTrades = trades.filter(t => t.status === 'closed' || t.status === undefined);
    closedTrades.forEach((t, idx)=>{
      const rowIndex = idx + 2;
      const row = sheet.getRow(rowIndex);
      row.getCell(1).value = 'Trade ' + (idx+1);
      row.getCell(2).value = t.date;
      row.getCell(3).value = t.pair;
      row.getCell(4).value = t.direction;
      row.getCell(4).font = { color: { argb: t.direction === 'BUY' ? 'FF16A34A' : 'FFDC2626' }, bold:true };
      row.getCell(5).value = t.plannedRR;
      row.getCell(6).value = t.marketMove;
      row.getCell(7).value = t.result;
      row.getCell(7).font = { color: { argb: t.result >= 0 ? 'FF16A34A' : 'FFDC2626' }, bold:true };
      row.getCell(8).value = t.logic || '';
      row.getCell(8).alignment = { wrapText: true, vertical: 'top' };
      row.getCell(9).value = t.whatMarketGave || '';
      row.getCell(9).alignment = { wrapText: true, vertical: 'top' };
      row.height = 80;

      ['beforeImage','afterImage'].forEach((field, colOffset)=>{
        const col = 10 + colOffset;
        if(t[field]){
          const match = t[field].match(/^data:image\/(png|jpeg|jpg|gif);base64,/);
          const ext = match ? (match[1] === 'jpg' ? 'jpeg' : match[1]) : 'png';
          const base64 = t[field].split(',')[1];
          const imageId = workbook.addImage({ base64, extension: ext });
          sheet.addImage(imageId, {
            tl: { col: col - 1 + 0.05, row: rowIndex - 1 + 0.05 },
            ext: { width: 90, height: 70 }
          });
        }
      });
    });

    const buffer = await workbook.xlsx.writeBuffer();
    const stamp = new Date().toISOString().slice(0,10);
    const filename = `trading-journal-${stamp}.xlsx`;

    if(window.AndroidBridge && window.AndroidBridge.saveExcelFile){
      const base64 = arrayBufferToBase64(buffer);
      window.AndroidBridge.saveExcelFile(base64, filename);
    } else {
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }catch(err){
    alert('Could not build the Excel file: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = 'EXPORT TO EXCEL';
  }
});

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 8192;
  for(let i=0; i<bytes.length; i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

document.getElementById('direction').value = 'BUY';
updateSummary();
document.getElementById('walletBalanceDisplay').textContent = formatMoney(wallet.balance);
document.getElementById('headerBalanceValue').textContent = formatMoney(wallet.balance);
if(!storageOK){
  setStatus('Auto-save unavailable — use Export to Excel to keep your data');
}
</script>
